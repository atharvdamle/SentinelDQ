services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:19092,CONTROLLER://:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1      
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 'XuFx1gYwT5GJugM1-sr6QQ'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host-side port only. In-network clients always use 5432.
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --address "0.0.0.0:9000" --console-address "0.0.0.0:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  validator:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: '1'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ADDRESS: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: ["python", "scripts/wait_and_run.py", "postgres:5432", "minio:9000", "--", "uvicorn", "data_validation.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  github-producer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - kafka
    environment:
      PYTHONUNBUFFERED: '1'
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      GITHUB_EVENTS_URL: ${GITHUB_EVENTS_URL}
      GITHUB_POLL_INTERVAL_SECONDS: ${GITHUB_POLL_INTERVAL_SECONDS}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command: ["python", "scripts/wait_and_run.py", "kafka:19092", "--", "python", "-m", "ingestion.producers.github_producer"]
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - app-network

  postgres-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      validator:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: '1'
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VALIDATOR_URL: http://validator:8000/validate
      VALIDATOR_TIMEOUT: ${VALIDATOR_TIMEOUT:-5}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-100}
      INGEST_FLUSH_INTERVAL: ${INGEST_FLUSH_INTERVAL:-5}
    command: ["python", "scripts/wait_and_run.py", "kafka:19092", "postgres:5432", "--", "python", "-m", "ingestion.consumers.postgres_consumer"]
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - app-network

  minio-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: '1'
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      MINIO_HOST: minio
      MINIO_API_PORT: '9000'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: 'False'
    command: ["python", "scripts/wait_and_run.py", "kafka:19092", "minio:9000", "--", "python", "-m", "ingestion.consumers.minio_consumer"]
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - app-network

  drift-detector:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: '1'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["python", "scripts/wait_and_run.py", "postgres:5432", "--", "python", "-m", "drift_engine.drift_service"]
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  kafka_data:

networks:
  app-network:
    driver: bridge